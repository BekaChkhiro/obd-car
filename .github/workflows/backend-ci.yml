name: Backend CI

on:
  pull_request:
    paths:
      - 'services/backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main, master]
    paths:
      - 'services/backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: services/backend

jobs:
  lint-and-test:
    name: Lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      JWT_SECRET: 'ci-test-secret-not-real-do-not-use-in-prod'
      ANTHROPIC_API_KEY: 'sk-ant-ci-placeholder'
      GOOGLE_CLIENT_ID: 'ci-placeholder'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: '0.5.11'
          enable-cache: true
          cache-dependency-glob: 'services/backend/uv.lock'

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run --with ruff ruff check src tests

      - name: Ruff (format check)
        run: uv run --with ruff ruff format --check src tests

      - name: Pytest
        run: uv run pytest -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/backend
          file: services/backend/Dockerfile
          push: false
          load: false
          tags: obd-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
