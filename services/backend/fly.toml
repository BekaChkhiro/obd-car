# Fly.io deployment config for the OBD-II FastAPI backend.
#
# Provision once before first deploy:
#   fly apps create obd-ai-backend
#   fly volumes create obd_data --region fra --size 1
#   fly secrets set \
#     ANTHROPIC_API_KEY=... \
#     JWT_SECRET=... \
#     SENDER_GE_API_KEY=... \
#     TEST_PHONE_NUMBERS=+995555000001:8264  # App Store review only \
#     CORS_ORIGINS=https://your-app.example.com  # comma-separated for multiple
#
# Deploy:
#   fly deploy --config fly.toml

app = "obd-ai-backend"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  LOG_LEVEL = "INFO"
  DB_PATH = "/data/obd.db"
  # CORS_ORIGINS is intentionally NOT set here — it must be provided via
  # `fly secrets set CORS_ORIGINS=...` so the prod allowlist is never
  # committed to the repo and can't accidentally fall back to a placeholder.

# Persistent volume — SQLite lives here. Without this, Fly's rootfs is
# ephemeral and the database is wiped on every restart/deploy.
[[mounts]]
  source = "obd_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # Wired to FastAPI /health endpoint.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  # SQLite + a single mounted volume → only one machine can hold the
  # write lock safely. Roll one VM at a time.
  strategy = "rolling"
  # Must be > 0. With a single machine, `0` makes flyctl compute an empty
  # rolling pool and abort the deploy ("pool size must be > 0"). Replacing the
  # one machine that owns the volume means a short gap either way — there is no
  # second machine to serve traffic while it restarts.
  max_unavailable = 1
