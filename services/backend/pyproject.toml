[project]
name = "backend"
version = "0.1.0"
description = "FastAPI orchestrator for OBD-II AI Diagnostic Assistant"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "anthropic>=0.40.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "fastapi>=0.136.1",
    "google-auth>=2.35.0",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.10.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "db"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# B008 — FastAPI uses `Depends()` as default argument by design.
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
