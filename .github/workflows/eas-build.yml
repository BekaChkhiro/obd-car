name: EAS Build & Submit

# Triggered manually or on version tags (e.g. v1.2.3).
# - preview profile: builds an APK/IPA for internal distribution, submits to
#   TestFlight beta group and Android internal track.
# - production profile: builds App Bundle/IPA for store submission.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      platform:
        description: 'Target platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      submit:
        description: 'Auto-submit after build'
        required: false
        default: false
        type: boolean

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 10.30.3
  NODE_VERSION: 20

jobs:
  build:
    name: EAS Build (${{ github.event.inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Expo token
        run: echo "EXPO_TOKEN=${{ secrets.EXPO_TOKEN }}" >> $GITHUB_ENV

      - name: Determine profile
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "profile=production" >> "$GITHUB_OUTPUT"
            echo "platform=all"      >> "$GITHUB_OUTPUT"
            echo "submit=true"       >> "$GITHUB_OUTPUT"
          else
            echo "profile=${{ github.event.inputs.profile }}"   >> "$GITHUB_OUTPUT"
            echo "platform=${{ github.event.inputs.platform }}" >> "$GITHUB_OUTPUT"
            echo "submit=${{ github.event.inputs.submit }}"     >> "$GITHUB_OUTPUT"
          fi

      - name: EAS Build
        working-directory: apps/mobile
        run: |
          SUBMIT_FLAG=""
          if [ "${{ steps.vars.outputs.submit }}" = "true" ]; then
            SUBMIT_FLAG="--auto-submit"
          fi
          npx eas-cli build \
            --profile "${{ steps.vars.outputs.profile }}" \
            --platform "${{ steps.vars.outputs.platform }}" \
            --non-interactive \
            $SUBMIT_FLAG
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
